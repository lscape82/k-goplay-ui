<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>압타바이오 — 엘리베이터 광고 매체 위치 (지역별)</title>
  <meta name="description" content="압타바이오 엘리베이터 광고 매체(포커스·타운보드) 지역별 위치 지도 — 잠실·서초·양재·노원상계·여의도">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "맑은 고딕", "Malgun Gothic", system-ui, sans-serif; color: #172033; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header { padding: 12px 18px; border-bottom: 1px solid #e5e9f0; background: #fff; }
    header h1 { margin: 0; font-size: 18px; font-weight: 800; color: #0b3a91; }
    header .sub { margin-top: 3px; font-size: 12.5px; color: #64748b; }
    #stage { position: relative; flex: 1; min-height: 0; display: flex; }
    #map { flex: 1; width: 100%; min-height: 0; }

    #leftcol { position: absolute; z-index: 16; left: 14px; top: 14px; bottom: 14px; width: 338px; max-width: 90vw; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    #leftcol > * { pointer-events: auto; }

    /* 지역 필터 */
    .regionbox { flex: none; background: #fff; border: 1px solid #e5e9f0; border-radius: 10px; padding: 10px 12px; box-shadow: 0 2px 10px rgba(15,23,42,.12); }
    .regionbox b { display: block; font-size: 12px; color: #64748b; margin-bottom: 7px; font-weight: 700; }
    .regionbox .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .rchip { font: inherit; font-size: 12.5px; font-weight: 700; border: 1px solid #dbe1ea; background: #fff; color: #334; border-radius: 999px; padding: 6px 11px; cursor: pointer; }
    .rchip .n { font-size: 11px; color: #94a3b8; margin-left: 3px; font-weight: 600; }
    .rchip:hover { background: #f3f6fb; }
    .rchip[aria-pressed="true"] { background: #0b3a91; color: #fff; border-color: #0b3a91; }
    .rchip[aria-pressed="true"] .n { color: #cfe0ff; }

    /* 범례 */
    .legend { flex: none; background: #fff; border: 1px solid #e5e9f0; border-radius: 10px; padding: 10px 13px; box-shadow: 0 2px 10px rgba(15,23,42,.12); font-size: 13px; }
    .legend b { display: block; font-size: 12px; color: #64748b; margin-bottom: 2px; font-weight: 700; }
    .legend .hint { display: block; font-size: 10.5px; color: #94a3b8; font-weight: 600; margin-bottom: 4px; }
    .legend .row { display: flex; align-items: center; gap: 7px; margin: 2px 0; font-weight: 700; width: 100%; background: none; border: 0; padding: 5px 7px; border-radius: 7px; cursor: pointer; font: inherit; color: inherit; text-align: left; }
    .legend .row:hover { background: #f3f6fb; }
    .legend .row .chk { margin-left: auto; width: 32px; height: 18px; border-radius: 999px; background: #22a06b; position: relative; flex: none; transition: background .15s; }
    .legend .row .chk::after { content: ""; position: absolute; top: 2px; left: 16px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: left .15s; }
    .legend .row[aria-pressed="false"] { opacity: .6; }
    .legend .row[aria-pressed="false"] .dot { background: #c3c9d4 !important; }
    .legend .row[aria-pressed="false"] .chk { background: #cbd2dd; }
    .legend .row[aria-pressed="false"] .chk::after { left: 2px; }
    .legend .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.18); flex: none; }
    .legend .dot.focus { background: #e53935; }
    .legend .dot.townboard { background: #1f74e6; }
    .legend .tot { margin-top: 7px; padding-top: 7px; border-top: 1px solid #eef1f7; color: #0b3a91; font-weight: 800; }
    .listtoggle { display: block; width: 100%; margin-top: 9px; background: #0b3a91; color: #fff; border: 0; border-radius: 9px; padding: 11px 13px; font: inherit; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 2px 10px rgba(11,58,145,.3); text-align: center; }
    .listtoggle:hover { background: #0a337f; }

    /* 핀 */
    .evpin { width: 20px; height: 20px; border-radius: 50% 50% 50% 0; border: 2px solid #fff; transform: rotate(-45deg); box-shadow: 0 2px 6px rgba(15,23,42,.35); cursor: pointer; }
    .evpin.focus { background: #e53935; } .evpin.townboard { background: #1f74e6; }
    .evpin.sel { box-shadow: 0 0 0 3px #ffd60a, 0 2px 7px rgba(15,23,42,.5); }
    .evpin i { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; border-radius: 50%; background: #fff; transform: translate(-50%,-50%) rotate(45deg); }

    /* 팝업 */
    .iw { font-family: inherit; padding: 13px 15px; min-width: 210px; max-width: 290px; background: #fff; border: 1px solid #e5e9f0; border-radius: 12px; box-shadow: 0 8px 26px rgba(15,23,42,.25); }
    .iw h3 { margin: 0 0 3px; font-size: 14px; font-weight: 800; }
    .iw .tags { display: flex; gap: 5px; margin-bottom: 2px; }
    .iw .brand { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; color: #fff; }
    .iw .brand.focus { background: #e53935; } .iw .brand.townboard { background: #1f74e6; }
    .iw .rtag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: #eef2f8; color: #475569; }
    .iw p { margin: 6px 0 0; font-size: 12.5px; color: #475569; line-height: 1.5; }
    .iw .facts { margin-top: 6px; font-size: 12.5px; color: #0b3a91; font-weight: 700; }
    .iw .iwsel { margin-top: 10px; width: 100%; padding: 8px; border: 1px solid #0b3a91; background: #0b3a91; color: #fff; border-radius: 8px; font: inherit; font-weight: 800; font-size: 12.5px; cursor: pointer; }
    .iw .iwsel.on { background: #fff; color: #0b3a91; }

    /* 목록/다운로드 패널 */
    .panel { flex: 1 1 auto; min-height: 0; background: #fff; border: 1px solid #e5e9f0; border-radius: 12px; box-shadow: 0 6px 20px rgba(15,23,42,.16); display: none; flex-direction: column; overflow: hidden; }
    .panel.open { display: flex; }
    .panel h2 { margin: 0; padding: 13px 15px; font-size: 15px; font-weight: 800; border-bottom: 1px solid #eef1f7; display: flex; align-items: center; gap: 8px; }
    .panel h2 .cnt { font-size: 12px; color: #0b3a91; font-weight: 800; }
    .panel .pclose { margin-left: auto; border: 0; background: none; font-size: 22px; cursor: pointer; color: #94a3b8; line-height: 1; padding: 0 2px; }
    .panel .ptools { padding: 10px 14px; border-bottom: 1px solid #eef1f7; display: flex; flex-direction: column; gap: 8px; }
    .panel .psearch { width: 100%; padding: 8px 10px; border: 1px solid #dbe1ea; border-radius: 8px; font: inherit; }
    .panel .prow2 { display: flex; gap: 7px; align-items: center; font-size: 12px; color: #64748b; }
    .panel .prow2 button { font: inherit; font-size: 12px; border: 1px solid #dbe1ea; background: #fff; border-radius: 7px; padding: 5px 9px; cursor: pointer; }
    .panel .prow2 button:hover { background: #f3f6fb; }
    .panel .plist { flex: 1; overflow: auto; padding: 6px 8px; }
    .panel .pitem { display: flex; align-items: flex-start; gap: 9px; padding: 8px; border-radius: 8px; cursor: pointer; }
    .panel .pitem:hover { background: #f5f8fc; }
    .panel .pitem.flash { animation: flashbg 1.4s ease; }
    @keyframes flashbg { 0% { background: #fff3bf; } 70% { background: #fff3bf; } 100% { background: transparent; } }
    .panel .pitem input { margin-top: 3px; flex: none; width: 16px; height: 16px; }
    .panel .pitem .nm { font-size: 13px; font-weight: 700; line-height: 1.35; }
    .panel .pitem .meta { font-size: 11px; color: #8a94a6; margin-top: 1px; }
    .panel .pitem .tag { display: inline-block; font-size: 10px; font-weight: 800; color: #fff; border-radius: 999px; padding: 0 6px; margin-right: 4px; vertical-align: 1px; }
    .tag.focus { background: #e53935; } .tag.townboard { background: #1f74e6; }
    .panel .pitem .rtag { display: inline-block; font-size: 10px; font-weight: 700; color: #475569; background: #eef2f8; border-radius: 999px; padding: 0 6px; margin-right: 4px; vertical-align: 1px; }
    .panel .pfoot { padding: 11px 14px; border-top: 1px solid #eef1f7; }
    .panel .dlbtn { width: 100%; padding: 12px; border: 0; border-radius: 9px; background: #0b3a91; color: #fff; font: inherit; font-weight: 800; font-size: 14px; cursor: pointer; }
    .panel .dlbtn:disabled { background: #c3c9d4; cursor: default; }
    .panel .dlhint { margin: 7px 0 0; font-size: 11px; color: #94a3b8; text-align: center; }

    #err { display: none; position: absolute; z-index: 20; inset: 60px 14px auto 14px; background: #fff4f4; border: 1px solid #f3c6c6; color: #a3322c; padding: 12px 14px; border-radius: 10px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <h1>압타바이오 — 엘리베이터 광고 매체 위치</h1>
      <div class="sub" id="sub">불러오는 중…</div>
    </header>
    <div id="stage">
      <div id="map"></div>

      <div id="leftcol">
        <div class="regionbox" id="regionbox" hidden>
          <b>지역 선택</b>
          <div class="chips" id="rchips"></div>
        </div>

        <div class="legend" id="legend" hidden>
          <b>매체 구분</b>
          <span class="hint">클릭하면 켜기 / 끄기</span>
          <button type="button" class="row" id="btnFocus" data-p="focus" aria-pressed="true"><span class="dot focus"></span>포커스미디어 <span id="lf"></span><span class="chk"></span></button>
          <button type="button" class="row" id="btnTb" data-p="townboard" aria-pressed="true"><span class="dot townboard"></span>타운보드 <span id="lt"></span><span class="chk"></span></button>
          <div class="tot" id="ltot"></div>
          <button type="button" class="listtoggle" id="listtoggle">📋 선택한 단지 리스트 다운로드</button>
        </div>

        <aside class="panel" id="panel" aria-hidden="true">
          <h2>선택한 단지 리스트 <span class="cnt" id="selcount">0곳 선택</span><button type="button" class="pclose" id="pclose" aria-label="닫기">×</button></h2>
          <div class="ptools">
            <input type="search" class="psearch" id="psearch" placeholder="단지명 검색">
            <div class="prow2">
              <button type="button" id="selall">보이는 단지 전체선택</button>
              <button type="button" id="selnone">전체해제</button>
            </div>
          </div>
          <div class="plist" id="plist"></div>
          <div class="pfoot">
            <button type="button" class="dlbtn" id="dlbtn" disabled>선택한 단지 다운로드</button>
            <p class="dlhint">엑셀(Excel)에서 바로 열리는 CSV 파일로 저장됩니다</p>
          </div>
        </aside>
      </div>

      <div id="err">지도를 불러오지 못했습니다. (네이버 지도 인증 도메인 확인 필요)</div>
    </div>
  </div>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=1ouo31myef"></script>
  <script>
    (async function () {
      var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
      var PLABEL = { focus: "포커스미디어", townboard: "타운보드" };
      var PSHORT = { focus: "포커스", townboard: "타운보드" };

      var data;
      try { data = await (await fetch("data/apta-elevator.json?v=1")).json(); }
      catch (e) { document.getElementById("sub").textContent = "데이터 로드 실패"; return; }
      var sites = data.sites || [];

      document.getElementById("sub").textContent =
        "총 " + data.counts.total + "곳 · 포커스미디어 " + data.counts.focus + " · 타운보드 " + data.counts.townboard + " · 5개 지역(잠실·서초·양재·노원상계·여의도) 아파트 엘리베이터 TV";
      document.getElementById("lf").textContent = data.counts.focus + "곳";
      document.getElementById("lt").textContent = data.counts.townboard + "곳";
      document.getElementById("ltot").textContent = "합계 " + data.counts.total + "곳";
      document.getElementById("regionbox").hidden = false;
      document.getElementById("legend").hidden = false;

      // region chips
      var rchips = document.getElementById("rchips");
      function chip(key, label, n, pressed) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "rchip"; b.dataset.region = key;
        b.setAttribute("aria-pressed", pressed ? "true" : "false");
        b.innerHTML = esc(label) + '<span class="n">' + n + '</span>';
        rchips.appendChild(b); return b;
      }
      chip("all", "전체", data.counts.total, true);
      data.regions.forEach(function (r) { chip(r.key, r.label, r.focus + r.townboard, false); });

      if (!(window.naver && naver.maps)) { document.getElementById("err").style.display = "block"; return; }

      var map = new naver.maps.Map("map", { zoom: 11, minZoom: 10, mapTypeControl: false, zoomControl: true, zoomControlOptions: { position: naver.maps.Position.RIGHT_CENTER } });
      var iw = new naver.maps.InfoWindow({ borderWidth: 0, backgroundColor: "transparent", disableAnchor: false, pixelOffset: new naver.maps.Point(0, -6) });
      var PIN_ANCHOR = new naver.maps.Point(10, 20);

      var recs = [];                 // {idx, site, marker, cb, el}
      var selected = new Set();
      var openIdx = null;
      var activeRegion = "all";
      var mediaOn = { focus: true, townboard: true };
      var plist = document.getElementById("plist");

      function pinHtml(s, sel) {
        var hover = s.name + " · " + PSHORT[s.product] + (s.monitors ? " · 모니터 " + s.monitors + "대" : "");
        return '<div class="evpin ' + s.product + (sel ? " sel" : "") + '" title="' + esc(hover) + '"><i></i></div>';
      }
      function iwHtml(r) {
        var s = r.site, on = selected.has(r.idx);
        var facts = [];
        if (s.monitors) facts.push("모니터 " + s.monitors + "대");
        if (s.households) facts.push(Number(s.households).toLocaleString("ko-KR") + "세대");
        if (s.pyeong) facts.push(s.pyeong + "평");
        if (s.year) facts.push(s.year + "년");
        return '<div class="iw"><h3>' + esc(s.name) + '</h3>' +
          '<div class="tags"><span class="brand ' + s.product + '">' + PLABEL[s.product] + '</span>' +
          '<span class="rtag">' + esc(s.regionLabel) + '</span></div>' +
          '<p>' + esc(s.addr) + '</p>' +
          (facts.length ? '<div class="facts">' + esc(facts.join(" · ")) + '</div>' : '') +
          '<button type="button" class="iwsel' + (on ? " on" : "") + '" onclick="window.__toggleSel(' + r.idx + ')">' + (on ? "✓ 선택됨 (해제)" : "+ 이 단지 선택") + '</button></div>';
      }

      var regionBounds = {};
      sites.forEach(function (s, idx) {
        var ll = new naver.maps.LatLng(s.lat, s.lng);
        if (!regionBounds[s.region]) regionBounds[s.region] = new naver.maps.LatLngBounds(ll, ll);
        regionBounds[s.region].extend(ll);
        var m = new naver.maps.Marker({
          map: map, position: ll,
          title: s.name + " · " + PSHORT[s.product] + (s.monitors ? " · 모니터 " + s.monitors + "대" : ""),
          icon: { content: pinHtml(s, false), anchor: PIN_ANCHOR },
          zIndex: s.product === "townboard" ? 60 : 50
        });

        var item = document.createElement("label");
        item.className = "pitem"; item.dataset.idx = idx;
        item.innerHTML = '<input type="checkbox">' +
          '<span><span class="nm"><span class="tag ' + s.product + '">' + PSHORT[s.product].slice(0, 2) + '</span>' +
          '<span class="rtag">' + esc(s.regionLabel) + '</span>' + esc(s.name) + '</span>' +
          '<span class="meta">' + esc(s.addr) + (s.monitors ? " · 모니터 " + s.monitors + "대" : "") + '</span></span>';
        var cb = item.querySelector("input");
        cb.addEventListener("change", function () { setSel(idx, cb.checked); });
        plist.appendChild(item);

        var r = { idx: idx, site: s, marker: m, cb: cb, el: item };
        recs.push(r);
        naver.maps.Event.addListener(m, "click", function () { openIdx = idx; iw.setContent(iwHtml(r)); iw.open(map, m); });
      });
      naver.maps.Event.addListener(iw, "close", function () { openIdx = null; });

      // ---- 지도 전체 bounds ----
      var allB = new naver.maps.LatLngBounds(recs[0].marker.getPosition(), recs[0].marker.getPosition());
      recs.forEach(function (r) { allB.extend(r.marker.getPosition()); });
      map.fitBounds(allB, { top: 50, right: 50, bottom: 50, left: 360 });

      function isVisible(r) {
        return (activeRegion === "all" || r.site.region === activeRegion) && mediaOn[r.site.product];
      }
      function applyVisibility() {
        recs.forEach(function (r) {
          var v = isVisible(r);
          r.marker.setMap(v ? map : null);
          var q = (document.getElementById("psearch").value || "").trim().toLowerCase();
          var matchSearch = !q || r.site.name.toLowerCase().indexOf(q) >= 0;
          r.el.style.display = (v && matchSearch) ? "" : "none";
        });
      }

      // ---- 지역 칩 ----
      rchips.addEventListener("click", function (e) {
        var b = e.target.closest(".rchip"); if (!b) return;
        activeRegion = b.dataset.region;
        Array.prototype.forEach.call(rchips.children, function (c) { c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
        applyVisibility();
        iw.close();
        if (activeRegion === "all") map.fitBounds(allB, { top: 50, right: 50, bottom: 50, left: 360 });
        else if (regionBounds[activeRegion]) map.fitBounds(regionBounds[activeRegion], { top: 60, right: 60, bottom: 60, left: 360 });
      });

      // ---- 선택 ----
      function setSel(idx, on) {
        var r = recs[idx]; if (!r) return;
        if (on) selected.add(idx); else selected.delete(idx);
        r.cb.checked = on;
        r.marker.setIcon({ content: pinHtml(r.site, on), anchor: PIN_ANCHOR });
        if (openIdx === idx && iw.getMap()) iw.setContent(iwHtml(r));
        updateCount();
      }
      window.__toggleSel = function (idx) {
        var on = !selected.has(idx);
        setSel(idx, on); iw.close();
        if (on) {
          openPanel();
          var r = recs[idx];
          if (r) { r.el.scrollIntoView({ block: "center" }); r.el.classList.remove("flash"); void r.el.offsetWidth; r.el.classList.add("flash"); }
        }
      };
      function updateCount() {
        var n = selected.size;
        document.getElementById("selcount").textContent = n + "곳 선택";
        var b = document.getElementById("dlbtn");
        b.disabled = n === 0;
        b.textContent = n === 0 ? "선택한 단지 다운로드" : ("선택한 " + n + "곳 다운로드");
      }

      document.getElementById("psearch").addEventListener("input", applyVisibility);
      document.getElementById("selall").addEventListener("click", function () {
        recs.forEach(function (r) { if (r.el.style.display !== "none") setSel(r.idx, true); });
      });
      document.getElementById("selnone").addEventListener("click", function () {
        Array.from(selected).forEach(function (idx) { setSel(idx, false); });
      });

      // ---- 패널 ----
      var panel = document.getElementById("panel");
      function openPanel() { panel.classList.add("open"); panel.setAttribute("aria-hidden", "false"); }
      function closePanel() { panel.classList.remove("open"); panel.setAttribute("aria-hidden", "true"); }
      document.getElementById("listtoggle").addEventListener("click", openPanel);
      document.getElementById("pclose").addEventListener("click", closePanel);

      // ---- 매체 토글 ----
      function wireToggle(id, product) {
        var btn = document.getElementById(id);
        btn.addEventListener("click", function () {
          var on = btn.getAttribute("aria-pressed") !== "true";
          btn.setAttribute("aria-pressed", on ? "true" : "false");
          mediaOn[product] = on; applyVisibility();
          if (!on) iw.close();
        });
      }
      wireToggle("btnFocus", "focus");
      wireToggle("btnTb", "townboard");

      // ---- 다운로드 ----
      function csvCell(v) { v = String(v == null ? "" : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
      document.getElementById("dlbtn").addEventListener("click", function () {
        var rows = recs.filter(function (r) { return selected.has(r.idx); });
        if (!rows.length) return;
        var head = ["지역", "단지명", "매체", "주소", "평형", "세대수", "모니터수", "준공년도"];
        var lines = [head.map(csvCell).join(",")];
        rows.forEach(function (r) {
          var s = r.site;
          lines.push([s.regionLabel, s.name, PLABEL[s.product], s.addr || "", s.pyeong || "", s.households || "", s.monitors || "", s.year || ""].map(csvCell).join(","));
        });
        var csv = "﻿" + lines.join("\r\n");
        var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "압타바이오_엘리베이터_선택단지_" + rows.length + "곳.csv";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      });

      updateCount();
    })();
  </script>
</body>
</html>
