<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>자생한방병원 전국 분원 — 버스광고 노선 선별 지도</title>
  <meta name="description" content="자생한방병원 전국 20개 분원 위치 지도. 수도권 중심·전국구 두 시나리오로 버스광고 노선을 선별하기 위한 1단계 분원 지도.">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: "Pretendard Variable", Pretendard, -apple-system, system-ui, "맑은 고딕", "Malgun Gothic", sans-serif; color: #172033; -webkit-font-smoothing: antialiased; }
    :root { --navy:#16215b; --navy2:#2b3b7a; --amber:#c67d16; --ink:#1f2937; --mut:#64748b; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    header { padding: 9px 18px; border-bottom: 1px solid #e5e9f0; background: #fff; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    header .home { display:flex; align-items:center; gap:11px; background:none; border:0; padding:0; cursor:pointer; text-align:left; flex:none; }
    header .logo { font-size:19px; font-weight:800; letter-spacing:-.5px; color:var(--navy); flex:none; }
    header .logo .h { color:#3a4a86; font-weight:800; }
    header .ttl { display:flex; flex-direction:column; }
    header .ttl .h1 { font-size:15px; font-weight:800; color:#172033; letter-spacing:-.3px; }
    header .ttl .sub { font-size:11.5px; color:var(--mut); margin-top:1px; }
    header .tabs { margin-left:auto; display:flex; gap:2px; overflow-x:auto; }
    header .tabs a { padding:8px 12px; border-radius:999px; font-size:13.5px; font-weight:700; color:var(--mut); white-space:nowrap; text-decoration:none; cursor:pointer; }
    header .tabs a:hover { color:var(--navy); background:#eef1fb; }
    header .tabs a.cur { color:#fff; background:var(--navy); }
    #stage { position: relative; flex: 1; min-height: 0; display: flex; }
    #map { flex: 1; width: 100%; min-height: 0; }
    #map img { filter: saturate(0.74); }
    #map .jpin, #map .jpin * { filter: none; }

    #leftcol { position: absolute; z-index: 16; left: 14px; top: 14px; bottom: 14px; width: 326px; max-width: 92vw; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    #leftcol > * { pointer-events: auto; }
    .box { flex: none; background: #fff; border: 1px solid #e5e9f0; border-radius: 10px; padding: 11px 13px; box-shadow: 0 2px 10px rgba(15,23,42,.12); }
    .box b.t { display: block; font-size: 13px; color: var(--ink); margin-bottom: 8px; font-weight: 800; letter-spacing: -.2px; }

    /* 시나리오 토글 */
    .scope { display: flex; gap: 8px; }
    .sc { flex: 1; border: 2px solid #dbe1ea; background: #fff; border-radius: 10px; padding: 9px 10px 10px; cursor: pointer; text-align: left; font: inherit; }
    .sc .sn { font-size: 13px; font-weight: 800; letter-spacing: -.2px; color:#334155; }
    .sc .sc2 { display:block; font-size: 11px; color: #94a3b8; margin-top: 2px; font-weight:600; }
    .sc .sct { display:inline-block; font-size:17px; font-weight:800; margin-top:3px; letter-spacing:-.4px; color:#334155; }
    .sc[aria-pressed="true"] { border-color: var(--navy); background:#eef1fb; box-shadow: 0 0 0 1px var(--navy) inset; }
    .sc[aria-pressed="true"] .sn, .sc[aria-pressed="true"] .sct { color: var(--navy); }
    .sc[aria-pressed="false"] { opacity:.72; }

    /* 요약 */
    .sum { display:flex; gap:7px; }
    .sum .cell { flex:1; background:#f6f8fc; border:1px solid #eef1f7; border-radius:8px; padding:7px 9px; }
    .sum .cell .k { font-size:10.5px; color:var(--mut); font-weight:700; }
    .sum .cell .v { font-size:16px; font-weight:800; color:var(--navy); letter-spacing:-.3px; margin-top:1px; }

    /* 안내 */
    .next { background:#f7f9fc; border:1px solid #e5e9f0; border-left:4px solid var(--navy); }
    .next .nt { display:block; font-size:12px; font-weight:800; color:var(--navy); margin-bottom:4px; }
    .next .nl { font-size:11.5px; color:#475569; line-height:1.65; font-weight:600; }

    /* 범례 */
    .legend .row { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; margin:3px 0; }
    .legend .dot { width:16px; height:16px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.15); flex:none; }
    .legend .dot.cap { background: var(--navy); } .legend .dot.loc { background: var(--amber); }
    .legend .mut { margin-left:auto; font-size:11px; color:#94a3b8; font-weight:600; }

    /* 분원 리스트 */
    .listbox { flex:1 1 auto; min-height:70px; overflow:auto; padding:8px 7px; }
    .grp { margin-bottom:7px; }
    .grp .gh { font-size:11px; font-weight:800; color:var(--mut); padding:3px 6px; letter-spacing:.2px; text-transform:none; display:flex; align-items:center; gap:6px; }
    .grp .gh .gc { color:#aab3c4; font-weight:700; }
    .bi { display:flex; align-items:center; gap:8px; padding:6px 7px; border-radius:7px; cursor:pointer; }
    .bi:hover { background:#f3f6fc; }
    .bi .bd { width:9px; height:9px; border-radius:50%; flex:none; }
    .bi .bd.cap { background: var(--navy); } .bi .bd.loc { background: var(--amber); }
    .bi .bn { font-size:13px; font-weight:700; color:#172033; flex:none; }
    .bi .ba { font-size:11px; color:#94a3b8; font-weight:600; margin-left:auto; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:170px; }
    .bi .star { color:var(--amber); font-size:11px; }

    /* 지도 핀 */
    .jpin { display:flex; align-items:center; gap:5px; background:var(--navy); color:#fff; border-radius:8px; padding:4px 9px; box-shadow:0 2px 8px rgba(15,23,42,.42); cursor:pointer; white-space:nowrap; border:1.5px solid #fff; position:relative; }
    .jpin.loc { background:var(--amber); }
    .jpin .jname { display:inline-flex; align-items:baseline; gap:2px; }
    .jpin .jcis { font-size:10px; font-weight:800; letter-spacing:-.3px; opacity:.9; }
    .jpin .jname .jq { font-size:11.5px; font-weight:800; letter-spacing:-.3px; }
    .jpin .jci { font-size:12.5px; font-weight:900; letter-spacing:-.4px; }
    .jpin .jci i { font-style:normal; font-weight:600; font-size:10px; letter-spacing:-.3px; margin-left:.5px; }
    .jpin .fs { font-size:10px; margin-left:1px; }
    .jpin::after { content:""; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); border-left:6px solid transparent; border-right:6px solid transparent; border-top:6px solid var(--navy); }
    .jpin.loc::after { border-top-color:var(--amber); }

    /* 팝업 */
    .iw { position: relative; font-family: inherit; padding: 13px 15px; min-width: 210px; max-width: 290px; background: #fff; border: 1px solid #e5e9f0; border-radius: 12px; box-shadow: 0 8px 26px rgba(15,23,42,.25); }
    .iw .iwx { position:absolute; top:7px; right:8px; width:26px; height:26px; border:0; background:#f1f3f6; color:#64748b; border-radius:50%; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .iw h3 { margin:0 24px 4px 0; font-size:15px; font-weight:800; color:#172033; }
    .iw .tag { display:inline-block; font-size:11px; font-weight:800; padding:1px 8px; border-radius:999px; color:#fff; }
    .iw .tag.cap { background:var(--navy); } .iw .tag.loc { background:var(--amber); }
    .iw p { margin:7px 0 0; font-size:12.5px; color:#475569; line-height:1.5; }

    /* 핀 노선 수 배지 */
    .jpin .cnt { font-style:normal; font-size:10px; font-weight:800; background:#fff; color:var(--navy); border-radius:999px; padding:0 5px; margin-left:1px; line-height:1.5; }
    .jpin.loc .cnt { color:var(--amber); }
    .jpin.hasr { box-shadow:0 0 0 2px #fff, 0 0 0 3.5px var(--navy), 0 2px 7px rgba(15,23,42,.4); }

    /* 노선 요약 줄 */
    .rsum { display:flex; gap:7px; margin-top:8px; }
    .rsum .c { flex:1; background:var(--navy); color:#fff; border-radius:8px; padding:7px 9px; }
    .rsum .c .k { font-size:10.5px; color:#cfe0ff; font-weight:700; }
    .rsum .c .v { font-size:16px; font-weight:800; letter-spacing:-.3px; margin-top:1px; }
    .rsum .c .v small { font-size:11px; font-weight:700; color:#cfe0ff; }

    /* 노선 팝업 버튼 */
    .iw .rfacts { margin-top:7px; font-size:12.5px; color:var(--navy); font-weight:800; }
    .iw .rbtn { margin-top:8px; display:block; width:100%; border:0; border-radius:8px; background:var(--navy); color:#fff; font:inherit; font-weight:800; font-size:12.5px; padding:9px; cursor:pointer; }

    /* 노선 패널 (우측) */
    .panel { position:absolute; z-index:18; right:14px; top:14px; bottom:14px; width:308px; max-width:92vw; background:#fff; border:1px solid #e5e9f0; border-radius:12px; box-shadow:0 8px 26px rgba(15,23,42,.22); display:none; flex-direction:column; overflow:hidden; }
    .panel.open { display:flex; }
    .panel .ph { padding:12px 14px; border-bottom:1px solid #eef1f7; }
    .panel .ph .pt { font-size:15px; font-weight:800; color:#172033; display:flex; align-items:center; gap:7px; }
    .panel .ph .pclose { margin-left:auto; border:0; background:#f1f3f6; color:#64748b; width:26px; height:26px; border-radius:50%; font-size:16px; cursor:pointer; }
    .panel .ph .pm { margin-top:7px; font-size:12px; color:var(--mut); font-weight:600; }
    .panel .ph .pm b { color:var(--navy); font-weight:800; }
    .panel .plist { flex:1; overflow:auto; padding:6px 8px; }
    .panel .gr { font-size:11px; font-weight:800; color:var(--mut); padding:7px 6px 3px; }
    .rrow { display:block; padding:7px 8px; border-radius:7px; cursor:pointer; border:1px solid transparent; }
    .rrow:hover { background:#f6f8fc; }
    .rrow.sel { background:#fff7ec; border-color:#f0d3a2; }
    .rrow .r1 { display:flex; align-items:center; gap:7px; }
    .rrow .rg { font-size:9.5px; font-weight:800; color:#fff; border-radius:4px; padding:1px 5px; flex:none; }
    .rg.SSA { background:#16215b; } .rg.SA { background:#3a4a86; } .rg.A { background:#6b79a8; } .rg.B { background:#9aa4c0; } .rg.etc { background:#b08968; }
    .rrow .rl { font-size:13px; font-weight:800; color:#172033; flex:none; min-width:40px; }
    .rrow .rstar { color:#e11d2a; font-size:12px; font-weight:800; margin-left:1px; flex:none; line-height:1; }
    .rrow.dim { opacity:.62; }
    .rrow .rtype { font-size:10px; color:#94a3b8; font-weight:700; flex:none; }
    .rrow .rq { margin-left:4px; font-size:11.5px; color:var(--navy); font-weight:800; flex:none; }
    .rrow .r2 { margin-top:3px; font-size:11px; color:#64748b; font-weight:600; line-height:1.45; }
    .rrow .r2 .sep { color:#cbd5e1; margin:0 4px; }
    .panel .phint { margin:7px 8px 5px; font-size:11.5px; color:var(--navy); font-weight:700; background:#eef1fb; border:1px solid #d7deef; border-radius:8px; padding:8px 10px; display:flex; align-items:center; gap:6px; }
    .panel .phint b { font-weight:800; }
    .panel .pnote { margin:0 8px 6px; font-size:11px; color:#92400e; font-weight:600; background:#fffbeb; border:1px solid #fce4b6; border-radius:8px; padding:7px 9px; line-height:1.5; }
    .panel .pnote b { font-weight:800; }
    .rrow .rgo { margin-left:auto; flex:none; color:#c67d16; font-weight:800; font-size:11px; white-space:nowrap; background:#fdf3e3; border:1px solid #f0d3a2; border-radius:6px; padding:2px 7px; }
    .rrow.sel .rgo { color:#a8630f; }
    .jpin.act { background:#fff; color:var(--navy); border-color:var(--navy); box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--navy), 0 3px 10px rgba(15,23,42,.45); }
    .jpin.act .jq, .jpin.act .jci, .jpin.act .jci i { color:var(--navy); }
    .jpin.act::after { border-top-color:#fff; }
    .jpin.act .cnt { background:var(--navy); color:#fff; }

    #err { display:none; position:absolute; z-index:20; inset:60px 14px auto 14px; background:#fff4f4; border:1px solid #f3c6c6; color:#a3322c; padding:12px 14px; border-radius:10px; font-size:13px; }

    @media (max-width:560px){ #leftcol{ width:auto; right:14px; } .bi .ba{ max-width:120px; } }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <button class="home" id="home" type="button" aria-label="처음 화면으로">
        <span class="logo">자생<span class="h">한방병원</span></span>
        <span class="ttl">
          <span class="h1">전국 분원 버스광고 노선 지도</span>
          <span class="sub" id="sub">불러오는 중…</span>
        </span>
      </button>
      <nav class="tabs" aria-label="제안 섹션">
        <a class="cur" aria-current="true">노선 지도</a>
        <a href="jaseng-proposal.html#intro">개요</a>
        <a href="jaseng-proposal.html#plan">운영안·견적</a>
        <a href="jaseng-proposal.html#why">선정 근거</a>
      </nav>
    </header>
    <div id="stage">
      <div id="map"></div>
      <div id="leftcol">
        <div class="box" id="scopebox" hidden>
          <b class="t">집행 범위 (견적 시나리오)</b>
          <div class="scope">
            <button type="button" class="sc" id="scCap" aria-pressed="false">
              <span class="sn">① 수도권 중심</span><span class="sct" id="nCap">–</span><span class="sc2">서울·경기·인천 분원</span>
            </button>
            <button type="button" class="sc" id="scAll" aria-pressed="true">
              <span class="sn">② 전국구</span><span class="sct" id="nAll">–</span><span class="sc2">전 분원 분산</span>
            </button>
          </div>
        </div>

        <div class="box" id="sumbox" hidden>
          <div class="sum">
            <div class="cell"><div class="k">표시 분원</div><div class="v" id="sShown">–</div></div>
            <div class="cell"><div class="k">권역</div><div class="v" id="sAreas">–</div></div>
          </div>
        </div>

        <div class="box legend" id="legend" hidden>
          <div class="row"><span class="dot cap"></span>수도권 분원 <span class="mut" id="lCap"></span></div>
          <div class="row"><span class="dot loc"></span>지방 분원 <span class="mut" id="lLoc"></span></div>
          <div style="margin-top:6px;padding-top:6px;border-top:1px solid #eef1f7;font-size:11px;color:#64748b;font-weight:600">※ 모든 단가·견적은 <b>부가세(VAT) 별도</b>, 제작·부착비 별도</div>
        </div>

        <div class="box next" id="nextbox" hidden>
          <span class="nt">🚌 버스광고 노선 — 지도에 경로 표시</span>
          <div class="nl">분원 핀 클릭 → <b>노선 목록</b>, 노선 선택 시 <b>지도에 경로·운행정보</b>가 표시됩니다.<br><span style="display:inline-block;margin-top:5px;color:#92400e;font-weight:700">⚠️ 전 지역 공통 — 확정 예약 시점에 <b>광고 가능 버스 수량·노선 확인 필수</b> (차량 현황에 따라 변동).</span></div>
          <div class="rsum" id="rsum" style="display:none">
            <div class="c"><div class="k">서울 경유 노선</div><div class="v" id="rLines">–</div></div>
            <div class="c"><div class="k">광고버스</div><div class="v" id="rQty">–</div></div>
          </div>
        </div>

        <div class="box listbox" id="listbox" hidden></div>
      </div>

      <aside class="panel" id="panel">
        <div class="ph">
          <div class="pt"><span id="ptName">분원</span> 경유 노선 <button type="button" class="pclose" id="pclose">×</button></div>
          <div class="pm" id="pMeta"></div>
        </div>
        <div class="plist" id="plist"></div>
      </aside>

      <div id="err">지도를 불러오지 못했습니다. (네이버 지도 인증 도메인 확인 필요)</div>
    </div>
  </div>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=1ouo31myef"></script>
  <script>
    (async function () {
      var esc = function (s) { return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };
      var AREAS = ["서울","경기","인천","충청","영남","호남"];

      var data;
      try { data = await (await fetch("data/jaseng-branches.json?v=1")).json(); }
      catch (e) { document.getElementById("sub").textContent = "데이터 로드 실패"; return; }
      var B = data.branches || [];

      var R = null;
      try { R = await (await fetch("data/jaseng-routes.json?v=2")).json(); } catch (e) {}
      var RB = (R && R.branches) || {};
      B.forEach(function(b){ if (RB[b.name]) b.routes = RB[b.name]; });

      var GEO = null;
      try { GEO = await (await fetch("data/jaseng-routes-geo.json?v=2")).json(); } catch (e) {}
      var GR = (GEO && GEO.routes) || {};

      if (!window.naver || !naver.maps) { document.getElementById("err").style.display="block"; return; }

      var won = function(v){ return Number(v||0).toLocaleString("ko-KR"); };
      var GORD = { SSA:0, SA:1, S:1.5, A:2, B:3, "심야":4 };
      var gord = function(g){ return GORD.hasOwnProperty(g) ? GORD[g] : 9; };
      var glab = function(g){ return g==="심야" ? "심야버스" : g==="후보" ? "분원 인근 노선 (광고 가능 여부 확인 전)" : g==="매체" ? "매체사 보유 노선" : g+"급"; };
      var gclass = function(g){ return (g==="SSA"||g==="SA"||g==="A"||g==="B") ? g : "etc"; };
      var gbadge = function(g){ return g==="매체" ? "보유" : g; };

      var map = new naver.maps.Map("map", {
        center: new naver.maps.LatLng(36.7, 127.6), zoom: 7,
        mapDataControl:false, scaleControl:false, logoControl:true, mapTypeControl:false,
        zoomControl:true, zoomControlOptions:{ position: naver.maps.Position.RIGHT_CENTER }
      });

      var iw = new naver.maps.InfoWindow({ borderWidth:0, backgroundColor:"transparent", disableAnchor:true, pixelOffset:new naver.maps.Point(0,-8) });
      function openIW(b, marker){
        var cls = b.region==="capital" ? "cap" : "loc";
        var lab = b.region==="capital" ? "수도권" : "지방";
        var r = b.routes;
        var rfacts = r ? (r.candidate ? ('분원 인근 통과 '+r.count+'개 · 확인 전')
              : ('경유 노선 '+r.count+'개'+(r.qty?(' · 광고버스 '+won(r.qty)+'대'):''))) : '';
        var rhtml = r
          ? '<div class="rfacts">'+rfacts+'</div>'
            + '<button class="rbtn" onclick="window.__openPanel(\''+esc(b.name)+'\')">노선 목록 보기 →</button>'
          : (b.region==="capital" ? '<p style="color:#94a3b8">노선 데이터 추후 추가 예정</p>' : '');
        var html = '<div class="iw"><button class="iwx" onclick="window.__closeIW()">×</button>'
          + '<h3>'+esc(b.full||b.name)+(b.flagship?' <span style="color:#c67d16">★</span>':'')+'</h3>'
          + '<span class="tag '+cls+'">'+lab+'</span>'
          + '<p>'+esc(b.addr)+'</p>'+rhtml+'</div>';
        iw.setContent(html); iw.open(map, marker);
      }
      window.__closeIW = function(){ iw.close(); };

      var markers = [];
      B.forEach(function(b){
        var cls = b.region==="capital" ? "" : "loc";
        var hasr = !!b.routes;
        var cnt = hasr ? '<em class="cnt">'+b.routes.count+'</em>' : '';
        var content = '<div class="jpin '+cls+(hasr?' hasr':'')+'">'
          + '<span class="jname"><span class="jcis">자생</span><b class="jq">'+esc(b.name)+'</b></span>'
          + (b.flagship?'<span class="fs">★</span>':'')+cnt
          + '</div>';
        var pw = 22 + 24 + (b.name.length*12) + (hasr?28:0) + (b.flagship?12:0);
        var ax = pw/2, ay = 34;
        var mk = new naver.maps.Marker({
          position: new naver.maps.LatLng(b.lat, b.lng), map: null,
          icon: { content: content, anchor: new naver.maps.Point(ax, ay) }, zIndex: hasr?140:(b.region==="capital"?120:100)
        });
        naver.maps.Event.addListener(mk, "click", function(){ if(b.routes){ openPanel(b.name); } else { openIW(b, mk); } });
        markers.push({ b:b, mk:mk, base:content, baseZ:(hasr?140:(b.region==="capital"?120:100)), ax:ax, ay:ay });
      });

      // 노선 경로선 관리
      var routeLines = [];
      function clearLines(){ routeLines.forEach(function(x){ x.poly.setMap(null); }); routeLines = []; }
      function routeBounds(nums){
        var bnds = new naver.maps.LatLngBounds(); var any=false; var set={};
        nums.forEach(function(n){ set[n]=1; });
        routeLines.forEach(function(x){ if(set[x.num]&&x.coords) x.coords.forEach(function(c){ bnds.extend(new naver.maps.LatLng(c[0],c[1])); any=true; }); });
        return any?bnds:null;
      }
      // 추천 점수(등급·대수·커버리지)
      var GW = { SSA:6, SA:5, S:5, A:4, B:3, "매체":3, "심야":2, "후보":1 };
      function recoScore(l, gg){
        var s = (GW[l.grade]||2)*100;
        s += Math.min(l.qty||0, 60)*1.2;
        s += Math.min((gg&&gg.stopCount)||0, 120)*0.3;
        return s;
      }
      var RECSET = {};   // num -> true (추천 노선)
      function applyLineStyles(selNum){
        routeLines.forEach(function(x){
          var sel = selNum && x.num===selNum;
          var rec = !!RECSET[x.num], o;
          if(sel) o = { strokeColor:"#c67d16", strokeOpacity:0.98, strokeWeight:4.5, zIndex:120 };
          else if(selNum) o = { strokeColor:"#16215b", strokeOpacity: rec?0.3:0.06, strokeWeight: rec?2:1.4, zIndex: rec?12:3 };
          else o = { strokeColor:"#16215b", strokeOpacity: rec?0.82:0.1, strokeWeight: rec?2.5:1.4, zIndex: rec?20:3 };
          x.poly.setOptions(o);
        });
      }
      function drawBranchRoutes(b){
        clearLines();
        b.routes.lines.forEach(function(l){
          var g = GR[l.rid] || GR[l.line]; if(!g||!g.coords||!g.coords.length) return;
          var path = g.coords.map(function(c){ return new naver.maps.LatLng(c[0],c[1]); });
          var poly = new naver.maps.Polyline({ map:map, path:path, strokeColor:"#16215b", strokeOpacity:0.11, strokeWeight:2, strokeLineCap:"round", strokeLineJoin:"round", zIndex:5, clickable:true });
          naver.maps.Event.addListener(poly, "click", function(){ selectRoute(l.line); });
          routeLines.push({ num:l.line, poly:poly, coords:g.coords });
        });
        applyLineStyles(null);
      }
      function highlightRoute(num){ applyLineStyles(num); }
      function shorten(s){ s=String(s||"").replace(/(기점|종점|차고지|행)$/,""); return s.length>9?s.slice(0,9)+"…":s; }

      var actMk=null;
      function setActiveBranch(name){
        var m = markers.filter(function(x){ return x.b.name===name; })[0];
        if(actMk && actMk!==m){ actMk.mk.setIcon({content:actMk.base, anchor:new naver.maps.Point(actMk.ax,actMk.ay)}); actMk.mk.setZIndex(actMk.baseZ); }
        if(!m) return;
        var b=m.b, cls=b.region==="capital"?"":"loc";
        var hc='<div class="jpin '+cls+' act hasr"><span class="jname"><b class="jq">'+esc(b.name)+'</b><span class="jci">자생<i>한방병원</i></span></span></div>';
        var pw2 = 24 + (b.name.length*11) + 68 + (b.flagship?14:0);
        m.mk.setIcon({content:hc, anchor:new naver.maps.Point(pw2/2, 34)});
        m.mk.setZIndex(320); actMk=m;
      }
      function clearActiveBranch(){ if(actMk){ actMk.mk.setIcon({content:actMk.base, anchor:new naver.maps.Point(actMk.ax,actMk.ay)}); actMk.mk.setZIndex(actMk.baseZ); actMk=null; } }

      // 노선 패널
      function selectRoute(num){
        highlightRoute(num);
        Array.prototype.forEach.call(document.querySelectorAll("#plist .rrow"), function(el){
          var on = el.getAttribute("data-num")===num;
          el.classList.toggle("sel", on);
          if(on) el.scrollIntoView({ block:"nearest" });
        });
        var bnds = routeBounds([num]);
        if(bnds) map.fitBounds(bnds, { top:70, right:330, bottom:50, left:360 });
      }

      function openPanel(name){
        var b = B.filter(function(x){ return x.name===name; })[0];
        if (!b || !b.routes) return;
        var r = b.routes;
        iw.close();
        document.getElementById("ptName").textContent = b.name;
        var gparts = Object.keys(r.grades).filter(function(g){return g!=="매체"&&g!=="후보";})
          .sort(function(a,c){return gord(a)-gord(c);})
          .map(function(g){ return '<b>'+esc(g)+(g==="심야"?"":"급")+'</b> '+r.grades[g]; }).join(" · ");
        if (r.candidate) {
          document.getElementById("pMeta").innerHTML = '분원 인근 통과 노선 <b>'+r.count+'개</b> <span style="color:#b45309;font-weight:700">· 광고 가능 노선은 확인 전</span>';
        } else if (r.vendor) {
          document.getElementById("pMeta").innerHTML = '매체사 보유 경유 노선 <b>'+r.count+'개</b>' + (gparts ? '<br>'+gparts : '');
        } else {
          document.getElementById("pMeta").innerHTML = '경유 노선 <b>'+r.count+'개</b>' + (gparts ? '<br>'+gparts : '');
        }
        // 추천 점수 산정·정렬
        var scored = r.lines.map(function(l){ var gg = GR[l.rid]||GR[l.line]||{}; return { l:l, gg:gg, s:recoScore(l, gg) }; });
        scored.sort(function(a,c){ return c.s - a.s; });
        var N = Math.max(3, Math.round(scored.length*0.35)); if(N>10) N=10; if(N>scored.length) N=scored.length;
        RECSET = {};
        scored.forEach(function(it, i){ it.rec = i < N; if(it.rec) RECSET[it.l.line]=true; });
        function rowHtml(it){
          var l=it.l, gg=it.gg, g=l.grade;
          var route = gg.start ? (esc(shorten(gg.start))+' ↔ '+esc(shorten(gg.end))) : '';
          var times = gg.firstBus ? (esc(gg.firstBus)+'~'+esc(gg.lastBus)) : '';
          var term  = gg.term ? ('배차 '+esc(gg.term)+'분') : '';
          var stc   = gg.stopCount ? (gg.stopCount+'정류소') : '';
          var meta2 = [route, times, term, stc].filter(Boolean).join('<span class="sep">·</span>');
          var showG = (g==="SSA"||g==="SA"||g==="S"||g==="A"||g==="B"||g==="심야");
          var gb = showG ? '<span class="rg '+gclass(g)+'">'+esc(g)+'</span>' : '';
          return '<div class="rrow'+(it.rec?' rec':' dim')+'" data-num="'+esc(l.line)+'">'
            + '<div class="r1">'
            + '<span class="rl">'+esc(l.line)+'</span>'
            + (it.rec?'<span class="rstar">★</span>':'')
            + gb
            + (gg.typeLabel?'<span class="rtype">'+esc(gg.typeLabel)+'</span>':'')
            + '<span class="rgo">경로 ▸</span></div>'
            + (meta2?'<div class="r2">'+meta2+'</div>':'')
            + '</div>';
        }
        var h = '<div class="phint">👆 <b>경로</b>를 누르면 지도에서 해당 노선을 확인할 수 있습니다</div>';
        h += '<div class="gr rec">★ 추천 노선 ('+N+')</div>';
        scored.slice(0,N).forEach(function(it){ h += rowHtml(it); });
        if(scored.length>N){
          h += '<div class="gr">그 외 경유 노선 ('+(scored.length-N)+')</div>';
          scored.slice(N).forEach(function(it){ h += rowHtml(it); });
        }
        document.getElementById("plist").innerHTML = h;
        Array.prototype.forEach.call(document.querySelectorAll("#plist .rrow"), function(el){
          el.addEventListener("click", function(){ selectRoute(el.getAttribute("data-num")); });
        });
        document.getElementById("panel").classList.add("open");
        drawBranchRoutes(b);
        setActiveBranch(name);
        var bnds = routeBounds(r.lines.map(function(l){ return l.line; }));
        if(bnds) map.fitBounds(bnds, { top:70, right:330, bottom:50, left:360 });
      }
      window.__openPanel = function(n){ openPanel(n); };
      document.getElementById("pclose").addEventListener("click", function(){ document.getElementById("panel").classList.remove("open"); clearLines(); clearActiveBranch(); });

      var scope = "all"; // cap | all — 첫 화면은 전국구 기본

      function visible(b){ return scope==="all" || b.region==="capital"; }

      function fit(){
        var bnds = new naver.maps.LatLngBounds();
        var n=0;
        markers.forEach(function(m){ if(visible(m.b)){ bnds.extend(m.mk.getPosition()); n++; } });
        if(n>1) map.fitBounds(bnds, { top:70, right:70, bottom:50, left:360 });
        else if(n===1){ markers.forEach(function(m){ if(visible(m.b)){ map.setCenter(m.mk.getPosition()); map.setZoom(13);} }); }
      }

      function apply(){
        var shown=0, areaSet={}, capN=0, locN=0;
        markers.forEach(function(m){
          var on = visible(m.b);
          m.mk.setMap(on?map:null);
          if(on){ shown++; areaSet[m.b.area]=1; if(m.b.region==="capital")capN++; else locN++; }
        });
        document.getElementById("sShown").textContent = shown + "곳";
        document.getElementById("sAreas").textContent = Object.keys(areaSet).length + "개";
        document.getElementById("lCap").textContent = capN + "곳";
        document.getElementById("lLoc").textContent = scope==="all" ? locN+"곳" : "범위 밖";
        document.getElementById("scCap").setAttribute("aria-pressed", scope==="cap");
        document.getElementById("scAll").setAttribute("aria-pressed", scope==="all");
        renderList();
        fit();
      }

      function renderList(){
        var host = document.getElementById("listbox");
        var byArea = {};
        B.forEach(function(b){ if(!visible(b)) return; (byArea[b.area]=byArea[b.area]||[]).push(b); });
        var h = "";
        AREAS.forEach(function(a){
          var arr = byArea[a]; if(!arr||!arr.length) return;
          h += '<div class="grp"><div class="gh">'+esc(a)+' <span class="gc">'+arr.length+'</span></div>';
          arr.forEach(function(b){
            var cls = b.region==="capital"?"cap":"loc";
            h += '<div class="bi" data-n="'+esc(b.name)+'"><span class="bd '+cls+'"></span>'
               + '<span class="bn">'+esc(b.name)+(b.flagship?' <span class="star">★</span>':'')+'</span>'
               + '<span class="ba">'+esc(b.addr)+'</span></div>';
          });
          h += '</div>';
        });
        host.innerHTML = h;
        Array.prototype.forEach.call(host.querySelectorAll(".bi"), function(el){
          el.addEventListener("click", function(){
            var name = el.getAttribute("data-n");
            var m = markers.filter(function(x){ return x.b.name===name; })[0];
            if(!m) return;
            if(m.b.routes){ openPanel(name); }
            else { map.setCenter(m.mk.getPosition()); map.setZoom(Math.max(map.getZoom(),13)); openIW(m.b, m.mk); }
          });
        });
      }

      document.getElementById("scCap").addEventListener("click", function(){ scope="cap"; apply(); });
      document.getElementById("scAll").addEventListener("click", function(){ scope="all"; apply(); });

      // 제목(좌측 상단) 클릭 → 초기화
      function resetView(){
        document.getElementById("panel").classList.remove("open");
        clearLines(); clearActiveBranch(); iw.close();
        scope = "all"; apply();
      }
      document.getElementById("home").addEventListener("click", resetView);

      // 카운트 세팅
      var capTotal = B.filter(function(b){return b.region==="capital";}).length;
      var allTotal = B.length;
      document.getElementById("nCap").textContent = capTotal + "곳";
      document.getElementById("nAll").textContent = allTotal + "곳";
      document.getElementById("sub").textContent = "전국 " + allTotal + "개 분원 · 수도권 " + capTotal + " · 지방 " + (allTotal-capTotal);

      if (R && R.summary) {
        document.getElementById("rsum").style.display = "flex";
        document.getElementById("rLines").innerHTML = won(R.summary.unique_routes) + '<small>개</small>';
        document.getElementById("rQty").innerHTML = won(R.summary.unique_qty) + '<small>대</small>';
      }

      ["scopebox","sumbox","legend","nextbox","listbox"].forEach(function(id){ document.getElementById(id).hidden=false; });
      apply();
    })();
  </script>
</body>
</html>
