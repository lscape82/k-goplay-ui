<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GS25 편의점 TV · 중구 매체 지도 (광고주용)</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root{
      --brand:#00a862; --brand-dark:#007a46; --ink:#111827; --muted:#6b7280;
      --line:#e5e7eb; --bg:#f4f6f8; --card:#ffffff; --seoul:#2563eb; --incheon:#f97316;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:"SUIT Variable","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
    .app{display:flex;flex-direction:column;height:100%}
    header{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
    .logo .dot{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
    .sub{color:var(--muted);font-size:13px;font-weight:600}
    .badge{margin-left:auto;background:#ecfdf3;color:var(--brand-dark);border:1px solid #b8f0d0;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
    .main{flex:1;display:flex;min-height:0}
    .side{width:340px;max-width:44%;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
    .side .head{padding:14px 16px 10px}
    .side h1{font-size:15px;margin:0 0 3px}
    .side .cnt{color:var(--muted);font-size:12.5px}
    .filters{display:flex;gap:7px;padding:4px 16px 12px;flex-wrap:wrap}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:#374151}
    .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
    .chip .n{opacity:.7;margin-left:4px;font-weight:700}
    .list{overflow:auto;flex:1;padding:2px 10px 16px}
    .item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:7px 6px;cursor:pointer;transition:.12s;background:#fff}
    .item:hover{border-color:var(--brand);box-shadow:0 3px 10px rgba(0,168,98,.09)}
    .item.active{border-color:var(--brand);background:#f2fcf7}
    .item .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
    .item .nm{font-weight:700;font-size:14px}
    .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff}
    .tag.seoul{background:var(--seoul)}
    .tag.incheon{background:var(--incheon)}
    .item .ad{color:var(--muted);font-size:12px;line-height:1.45}
    .map-wrap{flex:1;position:relative;min-width:0}
    #map{position:absolute;inset:0}
    .legend{position:absolute;left:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);z-index:5}
    .legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
    .legend .pin{width:12px;height:12px;border-radius:50%}
    .pin.seoul{background:var(--seoul)} .pin.incheon{background:var(--incheon)}
    .pinM{transform:translate(-50%,-100%);cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
    .iw{font-family:inherit;padding:10px 12px;min-width:180px}
    .iw b{font-size:13.5px} .iw .r{font-size:11px;font-weight:700;color:#fff;padding:1px 6px;border-radius:5px;margin-left:6px}
    .iw .r.seoul{background:var(--seoul)} .iw .r.incheon{background:var(--incheon)}
    .iw p{margin:6px 0 0;font-size:12px;color:#4b5563;line-height:1.45}
    .note{padding:8px 16px;background:#fffbeb;border-top:1px solid #fde68a;color:#92400e;font-size:11.5px}
    @media(max-width:720px){
      .main{flex-direction:column}.side{width:100%;max-width:none;height:44%;border-right:none;border-bottom:1px solid var(--line)}
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo"><span class="dot">GS</span> GS25 편의점 TV</div>
      <span class="sub">중구 매체 위치 지도 · 광고주용</span>
      <span class="badge">샘플 · 총 32개 매장</span>
    </header>
    <div class="main">
      <aside class="side">
        <div class="head">
          <h1>중구 매체 리스트</h1>
          <div class="cnt" id="cnt"></div>
        </div>
        <div class="filters">
          <button class="chip on" data-f="all">전체<span class="n">32</span></button>
          <button class="chip" data-f="서울">서울 중구<span class="n">7</span></button>
          <button class="chip" data-f="인천">인천 중구<span class="n">25</span></button>
        </div>
        <div class="list" id="list"></div>
        <div class="note">※ 광고플레이 고객용 카탈로그와 분리된 광고주 전용 샘플 페이지입니다. 좌표는 주소 기반 자동 변환 결과로 일부 오차가 있을 수 있습니다.</div>
      </aside>
      <div class="map-wrap">
        <div id="map"></div>
        <div class="legend">
          <div class="row"><span class="pin seoul"></span> 서울 중구</div>
          <div class="row"><span class="pin incheon"></span> 인천 중구(영종)</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=1ouo31myef"></script>
  <script>
    const STORES = [{"name": "동대후문점", "region": "서울", "addr": "서애로1길 35, 1층", "lat": 37.5610296, "lng": 127.0000407}, {"name": "신공항3점", "region": "인천", "addr": "영종대로 120, 106,107호", "lat": 37.4948184, "lng": 126.4926531}, {"name": "신당삼성점", "region": "서울", "addr": "청구로1길23, 2동 B 101호", "lat": 37.5589235, "lng": 127.0179846}, {"name": "운남중앙점", "region": "인천", "addr": "운남안길10, 101,102호", "lat": 37.4934042, "lng": 126.5336964}, {"name": "월미중앙점", "region": "인천", "addr": "월미문화로65", "lat": 37.472673, "lng": 126.5966002}, {"name": "항동라이프점", "region": "인천", "addr": "연안부두로53번길 35", "lat": 37.4529419, "lng": 126.6044541}, {"name": "신포로데오점", "region": "인천", "addr": "개항로26", "lat": 37.4717435, "lng": 126.6256318}, {"name": "영종운중로점", "region": "인천", "addr": "운중로 45", "lat": 37.493478, "lng": 126.5385488}, {"name": "영종주민센터점", "region": "인천", "addr": "운남서로63, 1층", "lat": 37.4927925, "lng": 126.5296346}, {"name": "운서택지점", "region": "인천", "addr": "화랑목로100번길65-1, 1층 103호", "lat": 37.4940868, "lng": 126.4992393}, {"name": "중구도산로점", "region": "인천", "addr": "도산로 14-1, 1층", "lat": 37.4676687, "lng": 126.6374146}, {"name": "운서타운점", "region": "인천", "addr": "햇내로안길 24, 1층", "lat": 37.4959953, "lng": 126.4992398}, {"name": "영종동보점", "region": "인천", "addr": "하늘달빛로65, 801동 101호", "lat": 37.4845477, "lng": 126.5591632}, {"name": "뉴신당센터점", "region": "서울", "addr": "퇴계로88길48, 1층", "lat": 37.5636794, "lng": 127.0201311}, {"name": "영종자이점", "region": "인천", "addr": "운남서로 7, 상가 1동 101호, 102호", "lat": 37.4883372, "lng": 126.5314362}, {"name": "영종스카이탑다와라점", "region": "인천", "addr": "영종대로196번길15-7, 상가 110호,111호", "lat": 37.4913162, "lng": 126.5008246}, {"name": "연안해변점", "region": "인천", "addr": "연안부두로 17, 1층 전체", "lat": 37.4560305, "lng": 126.6040534}, {"name": "월미분수대점", "region": "인천", "addr": "월미문화로57", "lat": 37.4733207, "lng": 126.5968923}, {"name": "을왕그린점", "region": "인천", "addr": "을왕로58번길10-4", "lat": 37.4494015, "lng": 126.372334}, {"name": "영종중산점", "region": "인천", "addr": "운중로133, 103호", "lat": 37.4951783, "lng": 126.5479679}, {"name": "영종오션하임점", "region": "인천", "addr": "두미포로112, 상가 102,103호", "lat": 37.4933942, "lng": 126.5677474}, {"name": "신흥메트로점", "region": "인천", "addr": "제물량로 22, 1층", "lat": 37.4624717, "lng": 126.6375402}, {"name": "중구청산점", "region": "서울", "addr": "다산로32길 15, 1층 101호", "lat": 37.5611041, "lng": 127.0154741}, {"name": "서울스퀘어점", "region": "서울", "addr": "한강대로416, 지하1층", "lat": 37.5555057, "lng": 126.9737678}, {"name": "을지트윈점", "region": "서울", "addr": "을지로4가261-4번지", "lat": 37.5663567, "lng": 126.9969365}, {"name": "북창점", "region": "서울", "addr": "남대문로1길26", "lat": 37.5622021, "lng": 126.977548}, {"name": "영종로얄점", "region": "인천", "addr": "영종진광장로5, 103호", "lat": 37.4923477, "lng": 126.5785654}, {"name": "운남지서점", "region": "인천", "addr": "관창로12, 1층 일부", "lat": 37.4915166, "lng": 126.5314081}, {"name": "을왕해수욕장점", "region": "인천", "addr": "을왕로24-2, 1층", "lat": 37.4466664, "lng": 126.3733676}, {"name": "뉴신공항점", "region": "인천", "addr": "신도시남로149번길 17,1층", "lat": 37.4945117, "lng": 126.4884178}, {"name": "영종LH점", "region": "인천", "addr": "영종대로278번길50, 101호", "lat": 37.4846441, "lng": 126.5002608}, {"name": "영종운남점", "region": "인천", "addr": "운남로154번길 14", "lat": 37.4911312, "lng": 126.5344672}];
    const COLOR = { '서울':'#2563eb', '인천':'#f97316' };
    let map, markers = [], infoWindows = [], filter = 'all', activeIdx = -1;

    function pinSvg(color){
      return '<svg width="26" height="34" viewBox="0 0 26 34" class="pinM" xmlns="http://www.w3.org/2000/svg">'
        + '<path d="M13 0C5.8 0 0 5.8 0 13c0 9.2 13 21 13 21s13-11.8 13-21C26 5.8 20.2 0 13 0z" fill="'+color+'"/>'
        + '<circle cx="13" cy="13" r="5" fill="#fff"/></svg>';
    }

    function init(){
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(37.52, 126.80),
        zoom: 11, mapDataControl:false
      });
      STORES.forEach((s, i) => {
        const pos = new naver.maps.LatLng(s.lat, s.lng);
        const m = new naver.maps.Marker({
          position: pos, map,
          icon: { content: pinSvg(COLOR[s.region] || '#00a862'), anchor: new naver.maps.Point(13, 34) },
          title: s.name
        });
        const iw = new naver.maps.InfoWindow({
          content: '<div class="iw"><b>'+s.name+'</b><span class="r '+(s.region==='서울'?'seoul':'incheon')+'">'+s.region+' 중구</span>'
                   +'<p>'+s.addr+'</p></div>',
          borderWidth:0, disableAnchor:true, backgroundColor:'#fff', pixelOffset: new naver.maps.Point(0,-6)
        });
        naver.maps.Event.addListener(m, 'click', () => focus(i));
        markers.push(m); infoWindows.push(iw);
      });
      render();
      fitAll();
    }

    function fitAll(){
      const b = new naver.maps.LatLngBounds();
      STORES.forEach(s => b.extend(new naver.maps.LatLng(s.lat, s.lng)));
      map.fitBounds(b);
    }

    function visible(i){ return filter === 'all' || STORES[i].region === filter; }

    function focus(i){
      activeIdx = i;
      infoWindows.forEach(w => w.close());
      infoWindows[i].open(map, markers[i]);
      map.panTo(new naver.maps.LatLng(STORES[i].lat, STORES[i].lng));
      render();
      const el = document.querySelector('[data-i="'+i+'"]');
      if (el) el.scrollIntoView({block:'nearest', behavior:'smooth'});
    }

    function render(){
      const list = document.getElementById('list');
      const items = STORES.map((s,i)=>({s,i})).filter(o=>visible(o.i));
      document.getElementById('cnt').textContent = items.length + '개 매장 표시 중';
      list.innerHTML = items.map(({s,i}) =>
        '<div class="item '+(i===activeIdx?'active':'')+'" data-i="'+i+'">'
        +'<div class="top"><span class="nm">'+s.name+'</span>'
        +'<span class="tag '+(s.region==='서울'?'seoul':'incheon')+'">'+s.region+'</span></div>'
        +'<div class="ad">'+s.addr+'</div></div>'
      ).join('');
      list.querySelectorAll('.item').forEach(el =>
        el.addEventListener('click', () => focus(Number(el.dataset.i))));
      markers.forEach((m,i)=> m.setMap(visible(i) ? map : null));
    }

    document.querySelectorAll('.chip').forEach(c =>
      c.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
        c.classList.add('on'); filter = c.dataset.f; activeIdx = -1;
        infoWindows.forEach(w=>w.close());
        render();
        const b = new naver.maps.LatLngBounds(); let any=false;
        STORES.forEach((s,i)=>{ if(visible(i)){ b.extend(new naver.maps.LatLng(s.lat,s.lng)); any=true; }});
        if(any) map.fitBounds(b);
      }));

    if (window.naver && naver.maps) init();
    else window.addEventListener('load', init);
  </script>
</body>
</html>
