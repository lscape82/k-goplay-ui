<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가로변 버스쉘터 광고 매체 안내 | 광고플레이</title>
  <meta name="description" content="서울 가로변 버스쉘터 광고 매체를 지도에서 확인하고 위치·규격·광고료를 비교하세요.">
  <style>
    :root{--brand:#1a56db;--brand-dark:#1440a8;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f4f6f8;
      --sa:#e11d48;--a:#2563eb;--l:#6b7280}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:"SUIT Variable","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg)}
    .app{display:flex;flex-direction:column;height:100%}
    header{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
    .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
    .logo .dot{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800}
    .sub{color:var(--muted);font-size:13px;font-weight:600}
    .cta{margin-left:auto;display:flex;gap:8px;align-items:center}
    .cta .tel{font-weight:800;font-size:15px;color:var(--brand-dark)}
    .cta a.btn{background:var(--brand);color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:700;text-decoration:none}
    .main{flex:1;display:flex;min-height:0}
    .side{width:360px;max-width:46%;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
    .side .head{padding:14px 16px 8px}
    .side h1{font-size:16px;margin:0 0 3px}
    .side .cnt{color:var(--muted);font-size:12.5px}
    .filters{display:flex;gap:6px;padding:6px 14px 10px;flex-wrap:wrap}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer;color:#374151}
    .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
    .chip .n{opacity:.65;margin-left:3px;font-weight:700}
    .list{overflow:auto;flex:1;padding:2px 10px 16px}
    .item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:7px 6px;cursor:pointer;transition:.12s;background:#fff}
    .item:hover{border-color:var(--brand);box-shadow:0 3px 10px rgba(26,86,219,.09)}
    .item.active{border-color:var(--brand);background:#f2f6ff}
    .item .top{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
    .item .nm{font-weight:700;font-size:14px}
    .gb{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;color:#fff}
    .gb.SA{background:var(--sa)} .gb.A{background:var(--a)} .gb.L{background:var(--l)}
    .item .loc{color:var(--muted);font-size:12px;margin-bottom:6px}
    .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11.5px;color:#374151}
    .kv b{color:#6b7280;font-weight:600}
    .price{margin-top:7px;font-size:13px;font-weight:800;color:var(--brand-dark)}
    .price small{font-weight:600;color:var(--muted);font-size:11px}
    .map-wrap{flex:1;position:relative;min-width:0}
    #map{position:absolute;inset:0}
    .legend{position:absolute;left:12px;bottom:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.08);z-index:5}
    .legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
    .legend .pin{width:12px;height:12px;border-radius:50%}
    .pin.SA{background:var(--sa)} .pin.A{background:var(--a)} .pin.L{background:var(--l)}
    .pinM{cursor:pointer;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
    .iw{font-family:inherit;padding:12px 14px;min-width:220px;max-width:280px}
    .iw h3{margin:0 0 7px;font-size:14px;display:flex;align-items:center;gap:6px}
    .iw .kv2{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12px;color:#374151}
    .iw .kv2 b{color:#6b7280;font-weight:600}
    .iw .price{margin:8px 0 6px}
    .iw .ask{display:block;text-align:center;background:var(--brand);color:#fff;border-radius:7px;padding:7px;font-size:12.5px;font-weight:700;text-decoration:none;margin-top:4px}
    .note{padding:8px 16px;background:#f8fafc;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px}
    @media(max-width:720px){.main{flex-direction:column}.side{width:100%;max-width:none;height:46%;border-right:none;border-bottom:1px solid var(--line)}.cta .tel{display:none}}
  </style>
</head>

    const GUS = [{"gu": "영등포구", "n": 25}, {"gu": "용산구", "n": 10}, {"gu": "강남구", "n": 6}, {"gu": "성동구", "n": 5}, {"gu": "마포구", "n": 4}, {"gu": "서초구", "n": 1}];
    const GCOLOR = { SA:'#e11d48', A:'#2563eb', L:'#6b7280' };
    const TEL = '1533-1975';
    let map, markers = [], iws = [], filter = 'all', activeIdx = -1;

    function won(n){ return n ? (n).toLocaleString('ko-KR') + '원' : '상담 문의'; }
    function pinSvg(c){
      return '<svg width="26" height="34" viewBox="0 0 26 34" class="pinM" xmlns="http://www.w3.org/2000/svg">'
        +'<path d="M13 0C5.8 0 0 5.8 0 13c0 9.2 13 21 13 21s13-11.8 13-21C26 5.8 20.2 0 13 0z" fill="'+c+'"/>'
        +'<circle cx="13" cy="13" r="5" fill="#fff"/></svg>';
    }
    function iwHtml(s){
      return '<div class="iw"><h3><span class="gb '+s.gg+'">'+s.grade+'</span>'+s.name+'</h3>'
        +'<div class="kv2">'
        +'<b>위치</b><span>'+s.gu+' '+s.dong+'</span>'
        +'<b>광고면</b><span>'+(s.faces||'-')+'</span>'
        +'<b>규격</b><span>내경 '+(s.inner||'-')+' / 외경 '+(s.outer||'-')+'</span>'
        +'<b>조명</b><span>'+(s.light||'-')+'</span>'
        +'</div>'
        +'<div class="price">월 '+won(s.price)+' <small>VAT 별도</small></div>'
        +'<a class="ask" href="tel:'+TEL+'">이 매체 상담 문의 '+TEL+'</a>'
        +'</div>';
    }
    function init(){
      map = new naver.maps.Map('map', { center:new naver.maps.LatLng(37.53,126.99), zoom:12, mapDataControl:false });
      STOPS.forEach((s,i)=>{
        const m = new naver.maps.Marker({ position:new naver.maps.LatLng(s.lat,s.lng), map,
          icon:{ content:pinSvg(GCOLOR[s.gg]||'#6b7280'), anchor:new naver.maps.Point(13,34) }, title:s.name });
        const iw = new naver.maps.InfoWindow({ content:iwHtml(s), borderWidth:0, disableAnchor:true, backgroundColor:'#fff', pixelOffset:new naver.maps.Point(0,-6) });
        naver.maps.Event.addListener(m,'click',()=>focus(i));
        markers.push(m); iws.push(iw);
      });
      buildFilters(); render(); fitAll();
    }
    function fitAll(){ const b=new naver.maps.LatLngBounds(); let any=false;
      STOPS.forEach((s,i)=>{ if(vis(i)){ b.extend(new naver.maps.LatLng(s.lat,s.lng)); any=true; }});
      if(any) map.fitBounds(b,{top:70,right:70,bottom:70,left:70}); }
    function vis(i){ return filter==='all' || STOPS[i].gu===filter; }
    function focus(i){ activeIdx=i; iws.forEach(w=>w.close()); iws[i].open(map,markers[i]);
      map.panTo(new naver.maps.LatLng(STOPS[i].lat,STOPS[i].lng)); render();
      const el=document.querySelector('[data-i="'+i+'"]'); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'}); }
    function buildFilters(){
      const f=document.getElementById('filters');
      f.innerHTML = '<button class="chip on" data-f="all">전체<span class="n">'+STOPS.length+'</span></button>'
        + GUS.map(g=>'<button class="chip" data-f="'+g.gu+'">'+g.gu+'<span class="n">'+g.n+'</span></button>').join('');
      f.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
        f.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); c.classList.add('on');
        filter=c.dataset.f; activeIdx=-1; iws.forEach(w=>w.close()); render(); fitAll();
      }));
    }
    function render(){
      const items=STOPS.map((s,i)=>({s,i})).filter(o=>vis(o.i));
      document.getElementById('cnt').textContent = items.length+'개소 표시 중';
      document.getElementById('list').innerHTML = items.map(({s,i})=>
        '<div class="item '+(i===activeIdx?'active':'')+'" data-i="'+i+'">'
        +'<div class="top"><span class="gb '+s.gg+'">'+s.grade+'</span><span class="nm">'+s.name+'</span></div>'
        +'<div class="loc">'+s.gu+' '+s.dong+' · '+s.type+'형</div>'
        +'<div class="kv"><b>광고면</b><span>'+(s.faces||'-')+'</span>'
        +'<b>규격</b><span>'+(s.inner||'-')+' / '+(s.outer||'-')+'</span></div>'
        +'<div class="price">월 '+won(s.price)+' <small>VAT 별도</small></div>'
        +'</div>').join('');
      document.querySelectorAll('.item').forEach(el=>el.addEventListener('click',()=>focus(Number(el.dataset.i))));
      markers.forEach((m,i)=>m.setMap(vis(i)?map:null));
    }
    if (window.naver && naver.maps) init(); else window.addEventListener('load', init);
